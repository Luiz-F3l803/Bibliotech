{% extends 'base.html' %}
{% block titulo %}Nova Ficha de Empréstimo{% endblock %}
{% block conteudo %}

<div class="pagina-form">
    <h1>Nova ficha de empréstimo</h1>
    <p class="subtitulo">Preencha os dados abaixo para registrar um novo empréstimo.</p>

    <form method="POST" action="{{ url_for('nova_ficha') }}" class="form-padrao">

        <label for="pessoa_tipo">Quem está pegando o livro emprestado?</label>
        <select id="pessoa_tipo" name="pessoa_tipo" required onchange="alternarPessoa()">
            <option value="Aluno">Aluno</option>
            <option value="Professor">Professor</option>
        </select>

        <div id="bloco-aluno">
            <label for="aluno_id">Nome do aluno</label>
            <select id="aluno_id" name="pessoa_id_aluno" onchange="sincronizarPessoa()">
                <option value="">Selecione um aluno...</option>
                {% for a in alunos %}
                <option value="{{ a.id }}">{{ a.nome }} — Matrícula {{ a.matricula }}{% if a.turma %} ({{ a.turma }}){% endif %}</option>
                {% endfor %}
            </select>
        </div>

        <div id="bloco-professor" style="display:none">
            <label for="professor_id">Nome do professor</label>
            <select id="professor_id" name="pessoa_id_professor" onchange="sincronizarPessoa()">
                <option value="">Selecione um professor...</option>
                {% for p in professores %}
                <option value="{{ p.id }}">{{ p.nome }}{% if p.disciplina %} — {{ p.disciplina }}{% endif %}</option>
                {% endfor %}
            </select>
        </div>

        <input type="hidden" id="pessoa_id" name="pessoa_id" required>

        <label for="livro_id">Nome do livro</label>
        <select id="livro_id" name="livro_id" required>
            <option value="">Selecione um livro disponível...</option>
            {% for l in livros %}
            <option value="{{ l.id }}">{{ l.titulo }}{% if l.autor %} — {{ l.autor }}{% endif %} ({{ l.quantidade_disponivel }} disponível(is))</option>
            {% endfor %}
        </select>
        {% if not livros %}
        <p class="aviso-inline">Nenhum livro disponível no acervo no momento.</p>
        {% endif %}

        <label for="data_devolucao">Data de devolução</label>
        <input type="date" id="data_devolucao" name="data_devolucao" min="{{ hoje }}" value="{{ prazo_sugerido }}" required>

        <div class="acoes-form">
            <a href="{{ url_for('home') }}" class="btn btn-secundario">Cancelar</a>
            <button type="submit" class="btn btn-primario">Criar ficha</button>
        </div>
    </form>
</div>

<script>
function alternarPessoa() {
    const tipo = document.getElementById('pessoa_tipo').value;
    document.getElementById('bloco-aluno').style.display = (tipo === 'Aluno') ? 'block' : 'none';
    document.getElementById('bloco-professor').style.display = (tipo === 'Professor') ? 'block' : 'none';
    sincronizarPessoa();
}
function sincronizarPessoa() {
    const tipo = document.getElementById('pessoa_tipo').value;
    const valor = (tipo === 'Aluno')
        ? document.getElementById('aluno_id').value
        : document.getElementById('professor_id').value;
    document.getElementById('pessoa_id').value = valor;
}
document.getElementById('aluno_id').addEventListener('change', sincronizarPessoa);
document.getElementById('professor_id').addEventListener('change', sincronizarPessoa);
</script>
{% endblock %}
